<svg xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="900">

    <foreignObject x="0" y="0" width="1200"
                   height="900">
        <div xmlns="http://www.w3.org/1999/xhtml">
            
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    padding: 30px;
    background: #0a101f;
    color: #f8fafc;
    font-family: Arial, sans-serif;
}

.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px;
    min-height: 120px;

    background: #111827;
    border: 1px solid #263449;
    border-radius: 16px;

    text-decoration: none;
    color: #f8fafc;
}

.logo {
    width: 72px;
    height: 72px;
    object-fit: contain;
    border-radius: 12px;
}

.content {
    flex: 1;
}

h2 {
    margin: 0 0 8px 0;
    font-size: 20px;
}

p {
    margin: 0 0 12px 0;
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.5;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.tag {
    padding: 4px 8px;
    background: #1e293b;
    border-radius: 6px;
    color: #22d3ee;
    font-size: 11px;
}

@media (max-width: 700px) {
    .container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <a class="card" href="https://github.com/2004-abhi/DISTRACTED-DRIVER-DETECTION-SYSTEM-FINAL-YEAR-PROJECT">
      <img class="logo" src="https://raw.githubusercontent.com/2004-abhi/2004-abhi/main/logo/driver.png" alt="Distracted Driver Detection System">
      <div class="content">
        <h2>Distracted Driver Detection System</h2>
        <p>A hybrid deep learning system for real-time distracted driver detection using VGG16 and BiLSTM.</p>
        <div class="tags"><span class="tag">Python</span> <span class="tag">TensorFlow</span> <span class="tag">Keras</span> <span class="tag">VGG16</span> <span class="tag">BiLSTM</span> <span class="tag">OpenCV</span></div>
      </div>
    </a>
    

    <a class="card" href="https://github.com/2004-abhi/CSS-PRACTICE">
      <img class="logo" src="https://raw.githubusercontent.com/2004-abhi/2004-abhi/main/logo/css.png" alt="CSS Practice">
      <div class="content">
        <h2>CSS Practice</h2>
        <p>A collection of CSS practice projects and frontend experiments.</p>
        <div class="tags"><span class="tag">HTML</span> <span class="tag">CSS</span> <span class="tag">Frontend</span></div>
      </div>
    </a>
    

    <a class="card" href="https://github.com/2004-abhi/HTML-CSS-JOURNEY-">
      <img class="logo" src="https://raw.githubusercontent.com/2004-abhi/2004-abhi/main/logo/html-css.png" alt="HTML CSS Journey">
      <div class="content">
        <h2>HTML CSS Journey</h2>
        <p>A learning journey featuring HTML and CSS practice, experiments, and web development projects.</p>
        <div class="tags"><span class="tag">HTML</span> <span class="tag">CSS</span> <span class="tag">Web Development</span></div>
      </div>
    </a>
    

    <a class="card" href="https://github.com/2004-abhi/Python-Journey">
      <img class="logo" src="https://raw.githubusercontent.com/2004-abhi/2004-abhi/main/logo/python.png" alt="Python Journey">
      <div class="content">
        <h2>Python Journey</h2>
        <p>A structured Python learning journey with practice programs, concepts, and coding exercises.</p>
        <div class="tags"><span class="tag">Python</span> <span class="tag">Programming</span> <span class="tag">Learning</span></div>
      </div>
    </a>
    

    <a class="card" href="https://github.com/2004-abhi/HTML-CSS-WEB-PAGEE">
      <img class="logo" src="https://raw.githubusercontent.com/2004-abhi/2004-abhi/main/logo/web-page.png" alt="HTML CSS Web Pages">
      <div class="content">
        <h2>HTML CSS Web Pages</h2>
        <p>A collection of web page projects built using HTML and CSS.</p>
        <div class="tags"><span class="tag">HTML</span> <span class="tag">CSS</span> <span class="tag">Web Development</span> <span class="tag">Frontend</span></div>
      </div>
    </a>
    
</div>

</body>
</html>

        </div>
    </foreignObject>

</svg>
