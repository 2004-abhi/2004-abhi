name: Generate Projects Panel

on:
  push:
    branches:
      - main
    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/fetch_data.py"
      - ".github/scripts/generate_projects.py"

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch_data.py

      - name: Generate projects panel
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      - name: Save generated panel
        run: |
          mkdir -p projects
          cp out/projects.svg projects/projects.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add merged.json projects/projects.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update projects panel"
            git pull --rebase origin main
            git push
          fi